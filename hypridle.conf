general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = /home/sakthi/.config/hypr/scripts/display-resume.zsh  # restore the external display after its DP link reconnects.
}

listener {
    timeout = 300                                # 5min
    on-timeout = brightnessctl -s set 5          # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                 # 11min
    on-timeout = hyprctl eval 'hl.dsp.dpms("off")' # screen off when timeout has passed
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'   # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 900                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
