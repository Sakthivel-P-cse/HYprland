background {
    monitor =
    path = /home/sakthi/wallpapers/1.jpg
}

input-field {
    monitor =
    size = 180, 42
    outline_thickness = 1
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(ff3131)
    inner_color = rgb(1a0505)
    font_color = rgb(c0c0c0)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i></i>
    hide_input = false
    rounding = -1
    check_color = rgb(a6da95)
    fail_color = rgb(ed8796)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 35, 120
    halign = center
    valign = bottom
}

label {
    monitor =
    text = <span font='Iosevka Nerd Font ExtraBold'>$TIME</span>
    color = rgb(e5e4e2)
    font_size = 84
    font_family = Iosevka Nerd Font
    position = -100, -80
    halign = right
    valign = top
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
